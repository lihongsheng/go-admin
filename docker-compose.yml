version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: go-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: code_101
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
#    volumes:
#      - mysql_data:/var/lib/mysql
#    command:
#      - --character-set-server=utf8mb4
#      - --collation-server=utf8mb4_unicode_ci
#      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcode_101"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - go-admin-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: go-admin-server
    restart: unless-stopped
    ports:
      - "8989:8989"
    networks:
      - go-admin-net
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: go-admin-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - go-admin-net

  # Mock 模式前端：构建时注入 VITE_USE_MOCK=true，
  # 全系统接口由前端拦截器返回模拟数据，无需后端/数据库，打开即用
  web-mock:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "true"
    container_name: go-admin-web-mock
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - go-admin-net

volumes:
  mysql_data:

networks:
  go-admin-net:
    driver: bridge

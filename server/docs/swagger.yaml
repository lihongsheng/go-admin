        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_system.MchCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
      security:
      - BearerAuth: []
      summary: 更新商户
      tags:
      - 商户管理
  /api/v1/system/mch/{id}:
    get:
      parameters:
      - description: 商户ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.Merchant'
              type: object
      security:
      - BearerAuth: []
      summary: 根据 ID 获取商户详情
      tags:
      - 商户管理
  /api/v1/system/mch/list:
    get:
      parameters:
      - description: 公司名称
        in: query
        name: mch_name
        type: string
      - description: 商户编号
        in: query
        name: mch_no
        type: string
      - description: 状态（1正常 2停用）
        in: query
        name: status
        type: integer
      - description: 每页条数（最大50）
        in: query
        name: limit
        type: integer
      - description: 页码
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  properties:
                    list:
                      type: array
                    total:
                      type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 商户列表
      tags:
      - 商户管理
  /api/v1/system/mch/no/{mchNo}:
    get:
      parameters:
      - description: 商户编号
        in: path
        name: mchNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.Merchant'
              type: object
      security:
      - BearerAuth: []
      summary: 根据编号获取商户详情
      tags:
      - 商户管理
  /api/v1/system/menu:
    post:
      consumes:
      - application/json
      parameters:
      - description: 菜单信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_system.MenuCreateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysMenu'
              type: object
      security:
      - BearerAuth: []
      summary: 新增菜单
      tags:
      - 菜单管理
    put:
      consumes:
      - application/json
      parameters:
      - description: 菜单信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_system.MenuUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
      security:
      - BearerAuth: []
      summary: 更新菜单
      tags:
      - 菜单管理
  /api/v1/system/menu/{id}:
    delete:
      parameters:
      - description: 菜单ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
      security:
      - BearerAuth: []
      summary: 删除菜单（递归删除子节点）
      tags:
      - 菜单管理
  /api/v1/system/menu/tree:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_system.MenuTreeResp'

        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_system.RoleSetDefaultRouterReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
      security:
      - BearerAuth: []

basePath: /
definitions:
  enum.MchStatus:
    enum:
    - 2
    - 1
    format: int32
    type: integer
    x-enum-comments:
      MchStatusDisabled: 禁用
      MchStatusEnabled: 启用
    x-enum-descriptions:
    - 禁用
    - 启用
    x-enum-varnames:
    - MchStatusDisabled
    - MchStatusEnabled
  github_com_lihongsheng_go-admin_server_dto_base.CaptchaResp:
    properties:
      captcha_b64:
        type: string
      captcha_id:
        type: string
    type: object
  github_com_lihongsheng_go-admin_server_dto_base.LoginReq:
    properties:
      captcha_code:
        type: string
      captcha_id:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - captcha_code
    - captcha_id
    - password
    - username
    type: object
  github_com_lihongsheng_go-admin_server_dto_base.LoginResp:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysUser'
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.MchCreateRequest:
    properties:
      address:
        description: 地址
        type: string
      email:
        description: 联系电话
        type: string
      id:
        type: integer
      linker:
        description: 联系人
        type: string
      mch_name:
        description: 公司名字
        type: string
      phone:
        description: 联系电话
        type: string
      reason:
        description: 备注
        type: string
      status:
        allOf:
        - $ref: '#/definitions/enum.MchStatus'
        description: 0 停用 1 正常
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.MenuCreateReq:
    properties:
      api_rules:
        type: string
      component:
        type: string
      hidden:
        type: boolean
      icon:
        type: string
      keep_alive:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      permission:
        type: string
      redirect:
        type: string
      sort:
        type: integer
      title:
        type: string
      type:
        description: catalog / menu / button，空字符串表示 menu
        type: string
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.MenuTreeResp:
    properties:
      list:
        items:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysMenu'
        type: array
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.MenuUpdateReq:
    properties:
      api_rules:
        type: string
      component:
        type: string
      hidden:
        type: boolean
      icon:
        type: string
      id:
        type: integer
      keep_alive:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      permission:
        type: string
      redirect:
        type: string
      sort:
        type: integer
      title:
        type: string
      type:
        type: string
    required:
    - id
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.RoleAuthDetailResp:
    properties:
      default_router:
        type: string
      menu_ids:
        items:
          type: integer
        type: array
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.RoleAuthReq:
    properties:
      api_ids:
        items:
          type: integer
        type: array
      menu_ids:
        items:
          type: integer
        type: array
      role_id:
        type: integer
    required:
    - role_id
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.RoleCreateReq:
    properties:
      default_router:
        type: string
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
    required:
    - name
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.RoleListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysRole'
        type: array
      total:
        type: integer
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.RoleSetDefaultRouterReq:
    properties:
      default_router:
        type: string
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.RoleUpdateReq:
    properties:
      default_router:
        type: string
      id:
        type: integer
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
    required:
    - id
    - name
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.UserCreateReq:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
      phone:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      status:
        type: integer
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.UserListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysUser'
        type: array
      total:
        type: integer
    type: object
  github_com_lihongsheng_go-admin_server_dto_system.UserUpdateReq:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      password:
        type: string
      phone:
        type: string
      role_ids:
        description: RoleIDs 为 nil 表示不调整角色；空切片表示清空角色
        items:
          type: integer
        type: array
      status:
        type: integer
    required:
    - id
    type: object
  github_com_lihongsheng_go-admin_server_model_system.Merchant:
    properties:
      address:
        description: 地址
        type: string
      created_at:
        type: string
      email:
        description: 联系电话
        type: string
      id:
        type: integer
      linker:
        description: 联系人
        type: string
      mch_name:
        description: 公司名字
        type: string
      mch_no:
        description: 编号
        type: string
      phone:
        description: 联系电话
        type: string
      reason:
        description: 备注
        type: string
      status:
        description: 2 停用 1 正常
        type: integer
      updated_at:
        type: string
    type: object
  github_com_lihongsheng_go-admin_server_model_system.SysMenu:
    properties:
      api_rules:
        description: JSON 数组：[{"path":"/api/...","method":"GET"},...]
        type: string
      children:
        description: 虚拟字段，仅用于 JSON 序列化时组装树
        items:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysMenu'
        type: array
      component:
        description: 前端组件路径；catalog 用 "Layout"
        type: string
      created_at:
        type: string
      hidden:
        description: 是否隐藏
        type: boolean
      icon:
        description: 图标名（element-ui icon）
        type: string
      id:
        type: integer
      keep_alive:
        description: 是否缓存页面
        type: boolean
      name:
        description: 路由 name；button 为按钮名
        type: string
      parent_id:
        description: 父节点 ID，0 表示根
        type: integer
      path:
        description: 路由路径；catalog 如 /system，menu 如 user
        type: string
      permission:
        description: 权限码；button 必有值，如 user:add
        type: string
      redirect:
        description: 重定向路径
        type: string
      sort:
        description: 排序序号
        type: integer
      title:
        description: 显示标题
        type: string
      type:
        description: catalog / menu / button
        type: string
      updated_at:
        type: string
    type: object
  github_com_lihongsheng_go-admin_server_model_system.SysRole:
    properties:
      created_at:
        type: string
      default_router:
        description: 登录后默认首页路由
        type: string
      id:
        type: integer
      menus:
        items:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysMenu'
        type: array
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_lihongsheng_go-admin_server_model_system.SysUser:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      roles:
        items:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysRole'
        type: array
      status:
        description: 1启用 0禁用
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  github_com_lihongsheng_go-admin_server_utils_response.Body:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
host: localhost:8989
info:
  contact: {}
  description: '基于 Gin + Vue3 的后台管理系统 API。<br/>统一响应格式：<code>{"code":0,"msg":"ok","data":...}</code>，code=0
    成功，code=7 业务失败。<br/>所有 <code>/api/v1/system/*</code> 接口需要 <code>Authorization:
    Bearer &lt;token&gt;</code>。'
  title: go-admin API
  version: 1.0.0
paths:
  /api/v1/base/captcha:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_base.CaptchaResp'
              type: object
      summary: 获取图形验证码
      tags:
      - 基础接口
  /api/v1/base/info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_lihongsheng_go-admin_server_model_system.SysUser'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
      security:
      - BearerAuth: []
      summary: 获取当前登录用户信息
      tags:
      - 基础接口
  /api/v1/base/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_base.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_base.LoginResp'
              type: object
      summary: 用户登录
      tags:
      - 基础接口
  /api/v1/base/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 基础接口
  /api/v1/base/menu:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  properties:
                    menus:
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
      security:
      - BearerAuth: []
      summary: 获取当前用户菜单树
      tags:
      - 基础接口
  /api/v1/base/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 上传文件（最大 10MB）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
            - properties:
                data:
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 上传文件（登录用户均可上传）
      tags:
      - 基础接口
  /api/v1/system/mch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 商户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_lihongsheng_go-admin_server_dto_system.MchCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lihongsheng_go-admin_server_utils_response.Body'
      security:
      - BearerAuth: []
      summary: 新增商户
      tags:
      - 商户管理
    put:
      consumes:
      - application/json
      parameters:
      - description: 商户信息（需包含 ID）
